# Short scrape interval: a load test lasts minutes, so the default 15s-1m
# would leave only a handful of points per run.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
