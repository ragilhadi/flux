# Load test a sample service while cAdvisor and node_exporter record what it
# costs. Flux scrapes both exporters directly; no Prometheus is needed. From
# the repository root:
#
#   docker compose -f samples/monitoring/docker-compose.yml up -d api cadvisor node-exporter
#   docker compose -f samples/monitoring/docker-compose.yml run --rm flux
#
# Reports land in samples/monitoring/results/. The exporters run on the
# machine under test, so both are trimmed to what Flux reads and capped with
# CPU and memory limits: monitoring must not compete with the target.
# cAdvisor and node_exporter need read access to the host (Linux). On Docker
# Desktop (macOS, Windows) the "host" is Docker's VM.
name: flux-monitoring-demo

services:
  api:
    image: nginx:alpine
    container_name: flux-demo-api
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg
    command:
      # Collect only what Flux reads: Docker containers, no per-container
      # label copies, and only the metric groups behind Flux's presets.
      - --docker_only=true
      - --store_container_labels=false
      - --enable_metrics=cpu,memory,network,diskIO,oom_event,process
      # Refresh stats at Flux's 2s sampling interval instead of every second.
      - --housekeeping_interval=2s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    command:
      - --path.rootfs=/host
      # Only the collectors Flux reads, and none of the exporter's own Go
      # runtime metrics.
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.netstat
      - --collector.sockstat
      - --collector.netdev
      - --collector.diskstats
      - --web.disable-exporter-metrics
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

  flux:
    build: ../..
    profiles: ["test"]
    depends_on: [api, cadvisor, node-exporter]
    volumes:
      - ./flux.yaml:/app/config.yaml:ro
      - ./results:/app/results
